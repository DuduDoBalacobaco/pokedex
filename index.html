<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex pokémon</title>
    <link rel="icon" href="img/favicon/favicon.png" type="image/png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="src/main.js" defer></script>

</head>

<body>
    <main>

        <section id="main">
            <section id="tudo">
                <section id="show_pokemon"></section>

                <section id="pesquisas">
                    <input type="text" placeholder="Procure seu pokémon" id="search">
                    <i class="bi bi-search"></i>
                    
                    <section id="checkbox">
                        <div class="checkbox">
                            <input type="checkbox" id="water" class="check" onclick="aplicarFiltros()">
                            <label for="water" class="water">Water</label>

                            <input type="checkbox" id="fire" class="check" onclick="aplicarFiltros()">
                            <label for="fire" class="fire">Fire</label>

                            <input type="checkbox" id="normal" class="check" onclick="aplicarFiltros()">
                            <label for="normal" class="normal">Normal</label>
                        </div>
                        <div class="checkbox">
                            <input type="checkbox" id="electric" class="check" onclick="aplicarFiltros()">
                            <label for="electric" class="electric">Electric</label>

                            <input type="checkbox" id="grass" class="check" onclick="aplicarFiltros()">
                            <label for="grass" class="grass">Grass</label>

                            <input type="checkbox" id="ice" class="check" onclick="aplicarFiltros()">
                            <label for="ice" class="ice">Ice</label>
                        </div>
                        <div class="checkbox">
                            <input type="checkbox" id="fighting" class="check" onclick="aplicarFiltros()">
                            <label for="fighting" class="fighting">Fighting</label>

                            <input type="checkbox" id="poison" class="check" onclick="aplicarFiltros()">
                            <label for="poison" class="poison">Poison</label>

                            <input type="checkbox" id="ground" class="check" onclick="aplicarFiltros()">
                            <label for="ground" class="ground">Ground</label>
                        </div>
                        <div class="checkbox">
                            <input type="checkbox" id="flying" class="check" onclick="aplicarFiltros()">
                            <label for="flying" class="flying">Flying</label>

                            <input type="checkbox" id="psychic" class="check" onclick="aplicarFiltros()">
                            <label for="psychic" class="psychic">Psychic</label>

                            <input type="checkbox" id="bug" class="check" onclick="aplicarFiltros()">
                            <label for="bug" class="bug">Bug</label>
                        </div>
                        <div class="checkbox">
                            <input type="checkbox" id="rock" class="check" onclick="aplicarFiltros()">
                            <label for="rock" class="rock">Rock</label>

                            <input type="checkbox" id="ghost" class="check" onclick="aplicarFiltros()">
                            <label for="ghost" class="ghost">Ghost</label>

                            <input type="checkbox" id="dragon" class="check" onclick="aplicarFiltros()">
                            <label for="dragon" class="dragon">Dragon</label>
                        </div>
                        <div class="checkbox">
                            <input type="checkbox" id="dark" class="check" onclick="aplicarFiltros()">
                            <label for="dark" class="dark">Dark</label>

                            <input type="checkbox" id="steel" class="check" onclick="aplicarFiltros()">
                            <label for="steel" class="steel">Steel</label>

                            <input type="checkbox" id="fairy" class="check" onclick="aplicarFiltros()">
                            <label for="fairy" class="fairy">Fairy</label>
                        </div>
                    </section>   
                    
                    <section id="regions">
                        <div class="regions">
                            <input type="checkbox" id="kanto" class="check" onclick="aplicarFiltros()">
                            <label for="kanto" class="kanto">Kanto</label>

                            <input type="checkbox" id="johto" class="check" onclick="aplicarFiltros()">
                            <label for="johto" class="johto">Johto</label>

                            <input type="checkbox" id="hoenn" class="check" onclick="aplicarFiltros()">
                            <label for="hoenn" class="hoenn">Hoenn</label>
                        </div>

                        <div class="regions">
                            <input type="checkbox" id="sinnoh" class="check" onclick="aplicarFiltros()">
                            <label for="sinnoh" class="sinnoh">Sinnoh</label>

                            <input type="checkbox" id="unova" class="check" onclick="aplicarFiltros()">
                            <label for="unova" class="unova">Unova</label>

                            <input type="checkbox" id="kalos" class="check" onclick="aplicarFiltros()">
                            <label for="kalos" class="kalos">Kalos</label>
                        </div>

                        <div class="regions">
                            <input type="checkbox" id="alola" class="check" onclick="aplicarFiltros()">
                            <label for="alola" class="alola">Alola</label>

                            <input type="checkbox" id="galar" class="check" onclick="aplicarFiltros()">
                            <label for="galar" class="galar">Galar</label>

                            <input type="checkbox" id="paldea" class="check" onclick="aplicarFiltros()">
                            <label for="paldea" class="paldea">Paldea</label>
                        </div>
                    </section>

                </section>

            </section>
        </section>

    </main>
</body>

</html>
