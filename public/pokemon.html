<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon</title>
    <link rel="icon" href="/assets/favicon/favicon64x64.png" type="image/png">

    <link rel="stylesheet" href="/pokemon/assets/css/pokemon.css">
    <link rel="stylesheet" href="/assets/css/global.css">
    <script type="module" src="./pokemon.js" defer></script>
</head>

<body>

    <section class="container">

        <section class="perfil">
            <section class="imgs-pokemon">
                <button id="menor">&lt;</button>
                <button id="maior">&gt;</button>
            </section>

            <section class="textos">

                <section class="all_info">
                    <section class="info">
                        <section class="name-pokemon"></section>
                        <div id="type_extra">
                            <section class="types"></section>
                            <section class="extras"></section>
                        </div>
                        
                    </section>

                    <section class="info_wh">
                        <section class="weigth"></section>
                        <section class="heigth"></section>
                        <small id="pokemon_region"></small>
                    </section>
                        
                </section>
                
                <hr>

                <section class="rodape">
                    <section class="abilities"><span id="span_ability">Ability</span></section>

                    <section class="all_stats">
                        <section class="stats"><div class="bar hp"></div><span class="stats_span">hp</span></section>
                        <section class="stats"><div class="bar atk"></div><span class="stats_span">atk</span></section>
                        <section class="stats"><div class="bar spd"></div><span class="stats_span">spd</span></section>
                        <section class="stats"><div class="bar def"></div><span class="stats_span">def</span></section>
                        <section class="stats"><div class="bar sp_atk"></div><span class="stats_span">sp atk</span></section>
                        <section class="stats"><div class="bar sp_def"></div><span class="stats_span">sp def</span></section>
                    </section>

                </section>

            </section>
        </section>

        <section class="infos_pokemon">
            <p class="title_evo">Evolutions</p>
            <section class="section_evolution">
                <section class="evolution"></section>
            </section>


        </section>

    </section>


</body>

</html>
