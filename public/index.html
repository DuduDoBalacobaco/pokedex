<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokedex pokémon</title>

    <link rel="icon" href="assets/img/favicon/favicon64x64.png" type="image/png">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="js/main.js" type="module" defer></script>
</head>

<body>
    <canvas id="particles"></canvas>
    <main>

        <section id="main">
            <section id="tudo">
                <section id="show_pokemon"></section>

                <section id="pesquisas">
                    <input type="text" placeholder="Procure seu pokémon" id="search">
                    
                    <p>FILTRAR POR TIPO</p>

                    <section id="checkbox">
                        <div class="checkbox">
                            <input type="checkbox" id="water" class="check">
                            <label for="water" class="water">Water</label>

                            <input type="checkbox" id="fire" class="check">
                            <label for="fire" class="fire">Fire</label>

                            <input type="checkbox" id="normal" class="check">
                            <label for="normal" class="normal">Normal</label>
                        </div>
                        <div class="checkbox">
                            <input type="checkbox" id="electric" class="check">
                            <label for="electric" class="electric">Electric</label>

                            <input type="checkbox" id="grass" class="check">
                            <label for="grass" class="grass">Grass</label>

                            <input type="checkbox" id="ice" class="check">
                            <label for="ice" class="ice">Ice</label>
                        </div>
                        <div class="checkbox">
                            <input type="checkbox" id="fighting" class="check">
                            <label for="fighting" class="fighting">Fighting</label>

                            <input type="checkbox" id="poison" class="check">
                            <label for="poison" class="poison">Poison</label>

                            <input type="checkbox" id="ground" class="check">
                            <label for="ground" class="ground">Ground</label>
                        </div>
                        <div class="checkbox">
                            <input type="checkbox" id="flying" class="check">
                            <label for="flying" class="flying">Flying</label>

                            <input type="checkbox" id="psychic" class="check">
                            <label for="psychic" class="psychic">Psychic</label>

                            <input type="checkbox" id="bug" class="check">
                            <label for="bug" class="bug">Bug</label>
                        </div>
                        <div class="checkbox">
                            <input type="checkbox" id="rock" class="check">
                            <label for="rock" class="rock">Rock</label>

                            <input type="checkbox" id="ghost" class="check">
                            <label for="ghost" class="ghost">Ghost</label>

                            <input type="checkbox" id="dragon" class="check">
                            <label for="dragon" class="dragon">Dragon</label>
                        </div>
                        <div class="checkbox">
                            <input type="checkbox" id="dark" class="check">
                            <label for="dark" class="dark">Dark</label>

                            <input type="checkbox" id="steel" class="check">
                            <label for="steel" class="steel">Steel</label>

                            <input type="checkbox" id="fairy" class="check">
                            <label for="fairy" class="fairy">Fairy</label>
                        </div>
                    </section>  

                    <section>
                        <form>
                            <input type="radio" id="all" name="grupo" value="all" checked hidden>

                            <input type="radio" id="ambos" name="grupo" value="ambos">
                            <label for="ambos" class="ambos">Ambos</label><br>

                            <input type="radio" id="tipo_unico" name="grupo" value="tipo_unico">
                            <label for="tipo_unico" class="tipo_unico">Um tipo</label><br>
                            
                            <input type="radio" id="dois_tipos" name="grupo" value="dois_tipos">
                            <label for="dois_tipos" class="dois_tipos">Dois tipos</label>
                        </form>
                    </section>
                    
                    <p>FILTRAR POR REGIÃO</p>

                    <section id="regions">
                        <div class="regions">
                            <input type="checkbox" id="kanto" class="check">
                            <label for="kanto" class="kanto">Kanto</label>

                            <input type="checkbox" id="johto" class="check">
                            <label for="johto" class="johto">Johto</label>

                            <input type="checkbox" id="hoenn" class="check">
                            <label for="hoenn" class="hoenn">Hoenn</label>
                        </div>

                        <div class="regions">
                            <input type="checkbox" id="sinnoh" class="check">
                            <label for="sinnoh" class="sinnoh">Sinnoh</label>

                            <input type="checkbox" id="unova" class="check">
                            <label for="unova" class="unova">Unova</label>

                            <input type="checkbox" id="kalos" class="check">
                            <label for="kalos" class="kalos">Kalos</label>
                        </div>

                        <div class="regions">
                            <input type="checkbox" id="alola" class="check">
                            <label for="alola" class="alola">Alola</label>

                            <input type="checkbox" id="galar" class="check">
                            <label for="galar" class="galar">Galar</label>

                            <input type="checkbox" id="paldea" class="check">
                            <label for="paldea" class="paldea">Paldea</label>
                        </div>
                    </section>

                    <p>FILTRAR POR NÚMERO</p>

                    <section class="filtro-id">
                        <span id="id_min_text">1</span>

                        <div class="range-slider">

                            <div class="slider-track"></div>
                            <div class="slider-range" id="slider-range"></div>

                            <input type="range" id="id_min" min="1" max="1025" value="1">
                            <input type="range" id="id_max" min="1" max="1025" value="1025">

                        </div>
                        
                        <span id="id_max_text">1025</span>
                    </section>

                    <section class="btns">
                        <button type="button" id="btn-filtra">Aplicar filtros</button>
                        <button type="button" id="btn-remove">Remover filtros</button>
                    </section>

                </section>

            </section>
        </section>

    </main>
</body>

</html>
